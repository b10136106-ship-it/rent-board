<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>林口通勤圈找房看板</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ground: #E9EDF2;
    --surface: #FFFFFF;
    --surface-2: #F3F6F9;
    --ink: #14202D;
    --ink-2: #46586B;
    --muted: #7C8B9B;
    --line: #D3DBE4;
    --accent: #B5651A;
    --accent-soft: #F6E7D4;
    --good: #0E7A64;
    --good-soft: #D9EDE7;
    --warn: #A8461C;
    --warn-soft: #F7E2D8;
    --shadow: 0 1px 2px rgba(20, 32, 45, .07), 0 6px 18px -10px rgba(20, 32, 45, .18);
    --mono: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    --display: "Archivo", "Noto Sans TC", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0F1720;
      --surface: #16202B;
      --surface-2: #1C2833;
      --ink: #E6ECF2;
      --ink-2: #A9B8C6;
      --muted: #7A8B9B;
      --line: #2A3947;
      --accent: #E0954A;
      --accent-soft: #3A2A17;
      --good: #4FBFA3;
      --good-soft: #14332C;
      --warn: #E08256;
      --warn-soft: #3A2118;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 22px -12px rgba(0, 0, 0, .6);
    }
  }
  :root[data-theme="dark"] {
    --ground: #0F1720;
    --surface: #16202B;
    --surface-2: #1C2833;
    --ink: #E6ECF2;
    --ink-2: #A9B8C6;
    --muted: #7A8B9B;
    --line: #2A3947;
    --accent: #E0954A;
    --accent-soft: #3A2A17;
    --good: #4FBFA3;
    --good-soft: #14332C;
    --warn: #E08256;
    --warn-soft: #3A2118;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 22px -12px rgba(0, 0, 0, .6);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--sans); font-size: 15px; line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  button { font: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 22px 18px 64px; }

  header { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 14px 22px; margin-bottom: 18px; }
  h1 {
    font-family: var(--display); font-size: 26px; font-weight: 700;
    letter-spacing: -.01em; margin: 0; text-wrap: balance;
  }
  .sub { color: var(--ink-2); font-size: 13.5px; margin: 4px 0 0; }
  .sub b { font-weight: 500; color: var(--ink); }
  .who { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .who select {
    font: inherit; font-size: 13px; padding: 5px 9px; border-radius: 7px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  }
  .sync { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--good); }

  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .tab {
    display: flex; align-items: baseline; gap: 7px; padding: 8px 14px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
    border-radius: 999px; transition: background .12s, color .12s, border-color .12s;
  }
  .tab .n { font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; }
  .tab[aria-selected="true"] { background: var(--ink); color: var(--ground); border-color: var(--ink); }

  .layout { display: grid; grid-template-columns: 232px 1fr; gap: 20px; align-items: start; }
  @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }

  .filters {
    position: sticky; top: 14px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 12px; padding: 14px 15px; display: flex; flex-direction: column; gap: 15px;
    box-shadow: var(--shadow);
  }
  @media (max-width: 820px) { .filters { position: static; } }
  .flabel {
    font-size: 11px; letter-spacing: .09em; text-transform: uppercase;
    color: var(--muted); font-family: var(--display); font-weight: 600; margin-bottom: 7px;
  }
  .frow { display: flex; align-items: center; gap: 9px; font-size: 13.5px; color: var(--ink-2); }
  .fval { font-family: var(--mono); font-size: 12.5px; color: var(--ink); font-variant-numeric: tabular-nums; }

  .dual { position: relative; height: 26px; margin: 2px 0 -2px; }
  .dual .track {
    position: absolute; top: 11px; left: 0; right: 0; height: 4px;
    background: var(--line); border-radius: 2px;
  }
  .dual .fill { position: absolute; top: 0; height: 100%; background: var(--accent); border-radius: 2px; }
  .dual input {
    position: absolute; top: 0; left: 0; width: 100%; height: 26px; margin: 0;
    background: none; pointer-events: none; -webkit-appearance: none; appearance: none;
  }
  .dual input::-webkit-slider-thumb {
    pointer-events: auto; -webkit-appearance: none; width: 16px; height: 16px;
    border-radius: 50%; background: var(--accent); border: 2px solid var(--surface);
    box-shadow: 0 1px 3px rgba(0, 0, 0, .3); cursor: grab;
  }
  .dual input::-moz-range-thumb {
    pointer-events: auto; width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent); border: 2px solid var(--surface); cursor: grab;
  }
  .dual input::-moz-range-track { background: none; }

  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button {
    flex: 1; padding: 6px 4px; border: 0; background: var(--surface); color: var(--ink-2); font-size: 12.5px;
  }
  .seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
  .reset {
    border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-2);
    border-radius: 8px; padding: 7px; font-size: 12.5px;
  }

  .list { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .card {
    display: grid; grid-template-columns: 62px 1fr auto; gap: 0 15px; align-items: start;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 13px 15px; box-shadow: var(--shadow);
  }
  .card.is-no { opacity: .5; }
  .card.is-fav { border-color: var(--accent); }
  @media (max-width: 620px) {
    .card { grid-template-columns: 52px 1fr; }
    .acts { grid-column: 1 / -1; margin-top: 10px; }
  }

  .score { text-align: center; }
  .score .v {
    font-family: var(--display); font-size: 25px; font-weight: 700; line-height: 1.05;
    font-variant-numeric: tabular-nums; letter-spacing: -.02em;
  }
  .score .k { font-size: 10px; color: var(--muted); letter-spacing: .06em; }
  .rank { font-family: var(--mono); font-size: 11px; color: var(--muted); }

  .body { min-width: 0; }
  .ttl {
    font-weight: 500; font-size: 15px; text-decoration: none; display: block;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .ttl:hover { text-decoration: underline; text-decoration-color: var(--accent); }
  .specs {
    display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 5px;
    font-family: var(--mono); font-size: 12.5px; color: var(--ink-2);
    font-variant-numeric: tabular-nums;
  }
  .specs .em { color: var(--ink); font-weight: 500; }
  .specs .good .em { color: var(--good); }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
  .chip {
    font-size: 11.5px; padding: 2px 8px; border-radius: 5px;
    background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line);
  }
  .chip.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
  .chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
  .chip.new { background: var(--accent-soft); color: var(--accent); border-color: transparent; font-weight: 500; }
  .note {
    margin-top: 8px; font-size: 12.5px; color: var(--ink-2);
    border-left: 2px solid var(--accent); padding-left: 8px;
  }
  .note b { color: var(--ink); font-weight: 500; }
  .noteEdit { display: flex; gap: 6px; margin-top: 8px; }
  .noteEdit input {
    flex: 1; min-width: 0; font: inherit; font-size: 13px; padding: 6px 9px;
    border: 1px solid var(--accent); border-radius: 8px;
    background: var(--surface); color: var(--ink);
  }

  .acts { display: flex; gap: 6px; align-items: flex-start; }
  .act {
    border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
    border-radius: 8px; padding: 6px 9px; font-size: 12.5px; white-space: nowrap;
    transition: background .12s, color .12s, border-color .12s;
  }
  .act:hover { border-color: var(--ink-2); }
  .act[aria-pressed="true"] { background: var(--ink); color: var(--ground); border-color: var(--ink); }
  .act.fav[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .act.no[aria-pressed="true"] { background: var(--warn); border-color: var(--warn); color: #fff; }

  .empty { padding: 46px 20px; text-align: center; color: var(--muted); }
  footer { margin-top: 26px; color: var(--muted); font-size: 12.5px; line-height: 1.7; }
  footer code {
    font-family: var(--mono); font-size: 12px; background: var(--surface-2);
    padding: 1px 5px; border-radius: 4px; border: 1px solid var(--line);
  }

  /* 通關畫面(公開網頁版才會用到) */
  .gate {
    position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
    background: var(--ground); padding: 20px;
  }
  .gateCard {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 28px 26px; width: min(340px, 100%); box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 12px;
  }
  .gateTitle { font-family: var(--display); font-size: 21px; font-weight: 700; }
  .gateHint { margin: -6px 0 2px; color: var(--ink-2); font-size: 13.5px; }
  .gateCard input {
    font: inherit; font-size: 17px; letter-spacing: .2em; text-align: center;
    padding: 11px; border: 1px solid var(--line); border-radius: 9px;
    background: var(--surface-2); color: var(--ink);
  }
  .gateErr { color: var(--warn); font-size: 13px; }
  .gateBtn {
    border: 0; border-radius: 9px; padding: 11px; font-size: 15px; font-weight: 500;
    background: var(--accent); color: #fff;
  }

  /* 篩選面板:桌機常駐,手機收起來 */
  .filters > summary {
    display: none; cursor: pointer; font-weight: 500; font-size: 14px;
    list-style: none; padding: 2px 0;
  }
  .filters > summary::-webkit-details-marker { display: none; }
  /* details 收合時要退回 block,否則 flex 會蓋掉收合行為、內容照樣佔位 */
  .filters:not([open]) { display: block; }
  .filters > summary::after { content: " ▾"; color: var(--muted); }
  .filters[open] > summary::after { content: " ▴"; }

  /* ── 手機 ── */
  @media (max-width: 820px) {
    .wrap { padding: 14px 12px 48px; }
    h1 { font-size: 21px; }
    .sub { font-size: 12.5px; line-height: 1.45; }
    header { gap: 8px 14px; margin-bottom: 12px; align-items: center; }
    .who { margin-left: 0; width: 100%; justify-content: space-between; }
    .filters { position: static; gap: 13px; padding: 12px 13px; }
    .filters > summary { display: block; }
    .tabs {
      flex-wrap: nowrap; overflow-x: auto; margin: 0 -12px 12px; padding: 0 12px 2px;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { flex: 0 0 auto; padding: 7px 13px; font-size: 14px; }

    .card { grid-template-columns: 1fr; gap: 0; padding: 12px 13px; row-gap: 0; }
    .score {
      display: flex; align-items: baseline; gap: 6px; text-align: left; margin-bottom: 2px;
    }
    .score .v { font-size: 19px; }
    .score .k { font-size: 10px; }
    .rank { margin-left: auto; }
    .ttl { white-space: normal; font-size: 14.5px; line-height: 1.4; }
    .specs { gap: 3px 10px; font-size: 12px; margin-top: 6px; }
    .chips { gap: 4px; margin-top: 6px; }
    .chip { font-size: 11px; padding: 2px 7px; }
    .acts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 11px; }
    .act { padding: 9px 4px; text-align: center; font-size: 13px; }
    .noteEdit { flex-wrap: wrap; }
    .noteEdit input { font-size: 16px; }   /* iOS 小於16px會自動放大整頁 */
    footer { font-size: 12px; }
  }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>


<div class="wrap">
  <header>
    <div>
      <h1>林口通勤圈找房看板</h1>
      <p class="sub" id="meta"></p>
    </div>
    <div class="who">
      <label for="who">我是</label>
      <select id="who">
        <option value="米哥">米哥</option>
        <option value="另一半">另一半</option>
      </select>
      <span class="sync"><span class="dot" id="dot"></span><span id="syncTxt">連線中</span></span>
    </div>
  </header>

  <div class="tabs" id="tabs" role="tablist"></div>

  <div class="layout">
    <details class="filters" id="filterBox" open>
      <summary>篩選與排序</summary>
      <div>
        <div class="flabel">排序</div>
        <div class="seg" id="sortSeg">
          <button data-sort="score" aria-pressed="true">總分</button>
          <button data-sort="commute">通勤</button>
          <button data-sort="price">租金</button>
        </div>
      </div>
      <div>
        <div class="flabel">通勤時間</div>
        <div class="dual" data-key="commute">
          <div class="track"><div class="fill"></div></div>
          <input type="range" class="lo" min="0" max="60" step="5" value="0" aria-label="通勤最少">
          <input type="range" class="hi" min="0" max="60" step="5" value="60" aria-label="通勤最多">
        </div>
        <div class="frow"><span class="fval" id="vCommute"></span></div>
      </div>
      <div>
        <div class="flabel">租金</div>
        <div class="dual" data-key="price">
          <div class="track"><div class="fill"></div></div>
          <input type="range" class="lo" min="15000" max="30000" step="1000" value="15000" aria-label="租金最低">
          <input type="range" class="hi" min="15000" max="30000" step="1000" value="30000" aria-label="租金最高">
        </div>
        <div class="frow"><span class="fval" id="vPrice"></span></div>
      </div>
      <div>
        <div class="flabel">屋況分</div>
        <div class="dual" data-key="cond">
          <div class="track"><div class="fill"></div></div>
          <input type="range" class="lo" min="0" max="100" step="10" value="0" aria-label="屋況最低">
          <input type="range" class="hi" min="0" max="100" step="10" value="100" aria-label="屋況最高">
        </div>
        <div class="frow"><span class="fval" id="vCond"></span></div>
      </div>
      <div>
        <div class="flabel">只看</div>
        <div class="frow"><label><input type="checkbox" id="fNew"> 本週新案</label></div>
        <div class="frow"><label><input type="checkbox" id="fLift"> 有電梯</label></div>
        <div class="frow"><label><input type="checkbox" id="fPark"> 有車位</label></div>
      </div>
      <button class="reset" id="reset">清掉篩選</button>
    </details>

    <main class="list" id="list"></main>
  </div>

  <footer>
    分數 = 通勤30 ／ 屋況20 ／ 租金20 ／ 坪數10 ／ 硬體10 ／ 新鮮度10。
    通勤時間走Valhalla路徑規劃(機車、避開高速公路,已用實測校準),終點是公司。<br>
    標記兩人即時同步：<b>看過</b>降到後面、<b>不要</b>之後週報不再出現、<b>收藏</b>置頂。
    每週一08:10自動重跑,新案會標<code>新案</code>。
  </footer>
</div>

<script type="module">
  const DATA = await fetch("data.json?t=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.json(); });   // Claude版=內嵌;公開版=每次都抓最新的 data.json
  const HOUSES = DATA.houses;
  const NEW_IDS = new Set(DATA.new_ids || []);
  const LABEL = { fav: "收藏", seen: "看過", no: "不要" };

  let marks = {};
  let tab = "todo";
  let sort = "score";
  let editing = null;
  const el = (id) => document.getElementById(id);

  /* localStorage 在隱私模式/縮圖擷取時連讀取都會丟例外,一律包起來 */
  const store = {
    get(k, d) { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };

  /* 手機進來先把篩選收起來,免得要滑很久才看到物件 */
  if (window.matchMedia("(max-width: 820px)").matches) {
    document.getElementById("filterBox").open = false;
  }

  /* ── 身分(沒有登入身分可用,自己選) ── */
  const who = el("who");
  who.value = store.get("rent_who", "米哥");
  who.onchange = () => store.set("rent_who", who.value);

  /* ── 後端:Claude版=平台儲存;公開網頁版=Firestore;都沒有就單機 ── */
/* 公開網頁版後端:Firestore + 通關數字。不用登入,任何人有網址+通關數字就能一起標。
   FIREBASE_CONFIG / PASSCODE 由 build_board.py 從 firebase_config.json 灌進來。 */
const FB = {"apiKey": "AIzaSyCvo5Bd41g1S49fB7G8qcND8MCZr70CuCU", "authDomain": "rent-board-5f502.firebaseapp.com", "projectId": "rent-board-5f502", "storageBucket": "rent-board-5f502.firebasestorage.app", "messagingSenderId": "767918557776", "appId": "1:767918557776:web:6725c54ecbffc774365f55"};
const PASSCODE = "5201011";

const Backend = {
  live: false,
  _col: null,
  _fs: null,

  async start({ onMarks, onLocal, setSync }) {
    this._cb = { onMarks, onLocal, setSync };
    if (!FB || !FB.projectId) { setSync(false, "單機模式(標記只存這台裝置)"); onLocal(); return; }

    // 通關數字:記住就不用再問
    let pass = store.get("rent_pass", "");
    if (pass !== PASSCODE) { pass = await askPass(); }
    if (pass !== PASSCODE) { setSync(false, "單機模式(沒輸入通關數字)"); onLocal(); return; }
    store.set("rent_pass", pass);

    try {
      const appMod = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js");
      const fs = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
      this._fs = fs;
      const app = appMod.initializeApp(FB);
      const dbx = fs.getFirestore(app);
      this._col = fs.collection(dbx, "marks");
      this.live = true;
      setSync(true, "兩人即時同步");
      fs.onSnapshot(
        this._col,
        (snap) => {
          const m = {};
          snap.forEach((d) => { m[d.id] = d.data(); });
          onMarks(m);
        },
        () => setSync(false, "同步中斷,重整看看")
      );
    } catch (e) {
      setSync(false, "連不上資料庫,先用單機模式");
      onLocal();
    }
  },

  save(id, obj) {
    return this._fs.setDoc(this._fs.doc(this._col, id), { ...obj, pass: PASSCODE });
  },
  remove(id) {
    return this._fs.deleteDoc(this._fs.doc(this._col, id));
  },
};

/* 通關畫面:蓋住整頁,輸對才進去 */
function askPass() {
  return new Promise((resolve) => {
    const box = document.createElement("div");
    box.className = "gate";
    box.innerHTML = `
      <div class="gateCard">
        <div class="gateTitle">找房看板</div>
        <p class="gateHint">輸入通關數字才能一起標記</p>
        <input type="password" inputmode="numeric" id="gateInput" placeholder="通關數字" autocomplete="off">
        <div class="gateErr" id="gateErr" hidden>數字不對,再試一次</div>
        <button class="gateBtn" id="gateBtn">進去</button>
      </div>`;
    document.body.appendChild(box);
    const inp = box.querySelector("#gateInput");
    const go = () => {
      if (inp.value.trim() === PASSCODE) { box.remove(); resolve(inp.value.trim()); }
      else { box.querySelector("#gateErr").hidden = false; inp.select(); }
    };
    box.querySelector("#gateBtn").onclick = go;
    inp.onkeydown = (e) => { if (e.key === "Enter") go(); };
    inp.focus();
  });
}


  function setSync(ok, text) {
    el("dot").classList.toggle("on", !!ok);
    el("syncTxt").textContent = text;
  }
  function localLoad() {
    try { return JSON.parse(store.get("rent_marks", "{}")); } catch (e) { return {}; }
  }
  function localSave() { store.set("rent_marks", JSON.stringify(marks)); }

  Backend.start({
    onMarks: (m) => { marks = m; render(); },
    onLocal: () => { marks = localLoad(); render(); },
    setSync: setSync,
  });

  /* 文件id長 591-21952033 這樣,兩邊後端都吃得下 */
  async function mark(id, status) {
    const cur = marks[id];
    const next = cur && cur.status === status
      ? null
      : { status: status, note: (cur && cur.note) || "", by: who.value,
          at: new Date().toISOString().slice(0, 10) };
    if (next) { marks[id] = next; } else { delete marks[id]; }
    render();
    if (Backend.live) {
      try { next ? await Backend.save(id, next) : await Backend.remove(id); }
      catch (e) { setSync(false, "這筆沒存上,再點一次"); }
    } else { localSave(); }
  }

  /* 備註用頁內輸入框(Claude的沙箱把 prompt/alert 擋掉了) */
  async function saveNote(id, note) {
    const cur = marks[id] || {};
    const next = { status: cur.status || "seen", note: note, by: who.value,
                   at: new Date().toISOString().slice(0, 10) };
    marks[id] = next;
    editing = null;
    render();
    if (Backend.live) {
      try { await Backend.save(id, next); }
      catch (e) { setSync(false, "這筆沒存上,再試一次"); }
    } else { localSave(); }
  }

  /* ── 篩選:三個區間滑桿 ── */
  const RANGE = {
    commute: { lo: 0, hi: 60, min: 0, max: 60, valId: "vCommute",
               fmt: function (a, b) {
                 return a === 0 && b === 60 ? "不限" : a + " ~ " + (b === 60 ? "60+" : b) + " 分";
               } },
    price: { lo: 15000, hi: 30000, min: 15000, max: 30000, valId: "vPrice",
             fmt: function (a, b) { return a.toLocaleString() + " ~ " + b.toLocaleString() + " 元"; } },
    cond: { lo: 0, hi: 100, min: 0, max: 100, valId: "vCond",
            fmt: function (a, b) {
              return a === 0 && b === 100 ? "不限" : a + " ~ " + b + " 分";
            } },
  };
  const F = { onlyNew: false, lift: false, park: false };

  const dualBox = (key) => document.querySelector('.dual[data-key="' + key + '"]');

  function paintDual(key) {
    const r = RANGE[key];
    const fill = dualBox(key).querySelector(".fill");
    const span = r.max - r.min || 1;
    fill.style.left = ((r.lo - r.min) / span * 100) + "%";
    fill.style.right = ((r.max - r.hi) / span * 100) + "%";
    el(r.valId).textContent = r.fmt(r.lo, r.hi);
  }

  Object.keys(RANGE).forEach(function (key) {
    const r = RANGE[key];
    const box = dualBox(key);
    const lo = box.querySelector(".lo"), hi = box.querySelector(".hi");
    const step = +lo.step || 1;
    const onInput = function () {
      if (+lo.value > +hi.value - step) {          // 兩個拇指不能交叉
        if (document.activeElement === lo) { lo.value = +hi.value - step; }
        else { hi.value = +lo.value + step; }
      }
      r.lo = +lo.value; r.hi = +hi.value;
      paintDual(key);
      render();
    };
    lo.oninput = onInput;
    hi.oninput = onInput;
    paintDual(key);
  });

  ["fNew", "fLift", "fPark"].forEach(function (id) {
    const key = { fNew: "onlyNew", fLift: "lift", fPark: "park" }[id];
    el(id).onchange = function (e) { F[key] = e.target.checked; render(); };
  });

  el("reset").onclick = function () {
    F.onlyNew = false; F.lift = false; F.park = false;
    Object.keys(RANGE).forEach(function (key) {
      const r = RANGE[key], box = dualBox(key);
      r.lo = r.min; r.hi = r.max;
      box.querySelector(".lo").value = r.min;
      box.querySelector(".hi").value = r.max;
      paintDual(key);
    });
    ["fNew", "fLift", "fPark"].forEach(function (id) { el(id).checked = false; });
    render();
  };

  el("sortSeg").onclick = function (e) {
    const b = e.target.closest("button");
    if (!b) return;
    sort = b.dataset.sort;
    [].slice.call(el("sortSeg").children).forEach(function (x) {
      x.setAttribute("aria-pressed", x === b);
    });
    render();
  };

  function statusOf(h) { return (marks[h.id] || {}).status || "todo"; }

  function pass(h) {
    const cm = h.commute_min;
    if (cm != null && (cm < RANGE.commute.lo ||
        (RANGE.commute.hi < 60 && cm > RANGE.commute.hi))) return false;
    if (h.price < RANGE.price.lo || h.price > RANGE.price.hi) return false;
    const cs = h.cond_score == null ? 50 : h.cond_score;
    if (cs < RANGE.cond.lo || cs > RANGE.cond.hi) return false;
    if (F.onlyNew && !NEW_IDS.has(h.id)) return false;
    if (F.lift && h.lift !== "有" && (h.bonus_hit || []).indexOf("電梯") < 0) return false;
    if (F.park && (h.bonus_hit || []).indexOf("車位") < 0) return false;
    return true;
  }

  function render() {
    const counts = { todo: 0, fav: 0, seen: 0, no: 0 };
    HOUSES.forEach(function (h) { counts[statusOf(h)]++; });
    el("tabs").innerHTML = [["todo", "待看"], ["fav", "收藏"], ["seen", "看過"], ["no", "不要"]]
      .map(function (t) {
        return '<button class="tab" role="tab" data-tab="' + t[0] + '" aria-selected="' +
          (tab === t[0]) + '">' + t[1] + '<span class="n">' + counts[t[0]] + "</span></button>";
      }).join("");
    el("tabs").onclick = function (e) {
      const b = e.target.closest("button");
      if (b) { tab = b.dataset.tab; render(); }
    };

    const cfg = DATA.config;
    el("meta").innerHTML =
      "<b>" + DATA.date + "</b> 更新 · " + cfg.regions.join("、") + " · " +
      cfg.budget_min.toLocaleString() + "~" + cfg.budget_max.toLocaleString() + "元 · " +
      cfg.rooms_allow.join("/") + "房 · " + cfg.area_min_ping + "坪以上 · 共 <b>" +
      HOUSES.length + "</b> 筆";

    const rows = HOUSES.filter(function (h) { return statusOf(h) === tab && pass(h); })
      .sort(function (a, b) {
        if (sort === "commute") {
          return (a.commute_min == null ? 999 : a.commute_min) -
                 (b.commute_min == null ? 999 : b.commute_min);
        }
        if (sort === "price") return a.price - b.price;
        return b.score - a.score;
      });

    el("list").innerHTML = rows.length ? rows.map(function (h, i) {
      const m = marks[h.id] || {};
      const st = m.status || "todo";
      const cm = h.commute_min == null ? "?" : Math.round(h.commute_min) + "分";
      const cmClass = h.commute_min != null && h.commute_min <= 15 ? "good" : "";
      const chips = []
        .concat(NEW_IDS.has(h.id) ? ['<span class="chip new">新案</span>'] : [])
        .concat(h.shape ? ['<span class="chip">' + h.shape + "</span>"] : [])
        .concat(h.decorate ? ['<span class="chip">' + h.decorate + "</span>"] : [])
        .concat((h.bonus_hit || []).slice(0, 3).map(function (b) {
          return '<span class="chip good">' + b + "</span>";
        }))
        .concat((h.cond_flags || []).concat(h.penalty_hit || []).map(function (b) {
          return '<span class="chip warn">' + b + "</span>";
        }))
        .join("");
      const noteBlock = editing === h.id
        ? '<div class="noteEdit"><input type="text" id="noteInput" value="' +
          (m.note || "").replace(/"/g, "&quot;") +
          '" placeholder="打一句話,兩個人都看得到(Enter存,Esc取消)" maxlength="120">' +
          '<button class="act" data-id="' + h.id + '" data-s="save">存</button></div>'
        : m.note
          ? '<div class="note"><b>' + (m.by || "") + "</b>：" + m.note + "</div>"
          : m.by
            ? '<div class="note"><b>' + m.by + "</b> 標了" + (LABEL[m.status] || "") + "</div>"
            : "";
      return '<article class="card ' + (st === "no" ? "is-no " : "") +
        (st === "fav" ? "is-fav" : "") + '">' +
        '<div class="score"><div class="v">' + h.score + '</div><div class="k">分</div>' +
        '<div class="rank">#' + (i + 1) + "</div></div>" +
        '<div class="body">' +
        '<a class="ttl" href="' + h.url + '" target="_blank" rel="noopener">' + h.title + "</a>" +
        '<div class="specs">' +
        '<span class="' + cmClass + '">通勤 <span class="em">' + cm + "</span></span>" +
        "<span>" + h.price.toLocaleString() + " 元</span>" +
        "<span>" + (h.ping || "?") + " 坪</span>" +
        "<span>" + (h.layout || "-") + "</span>" +
        "<span>" + (h.floor || "-") + "</span>" +
        "<span>屋況 " + Math.round(h.cond_score == null ? 50 : h.cond_score) + "</span>" +
        "<span>" + h.addr + "</span></div>" +
        '<div class="chips">' + chips + "</div>" + noteBlock + "</div>" +
        '<div class="acts">' +
        '<button class="act fav" data-id="' + h.id + '" data-s="fav" aria-pressed="' +
        (st === "fav") + '">收藏</button>' +
        '<button class="act" data-id="' + h.id + '" data-s="seen" aria-pressed="' +
        (st === "seen") + '">看過</button>' +
        '<button class="act no" data-id="' + h.id + '" data-s="no" aria-pressed="' +
        (st === "no") + '">不要</button>' +
        '<button class="act" data-id="' + h.id + '" data-s="note">備註</button>' +
        "</div></article>";
    }).join("") : '<div class="empty">這一區沒有符合篩選的物件。</div>';

    el("list").onclick = function (e) {
      const b = e.target.closest("button.act");
      if (!b) return;
      const id = b.dataset.id;
      if (b.dataset.s === "note") { editing = editing === id ? null : id; render(); }
      else if (b.dataset.s === "save") { saveNote(id, el("noteInput").value.trim()); }
      else { mark(id, b.dataset.s); }
    };

    const inp = el("noteInput");
    if (inp) {
      inp.focus();
      inp.setSelectionRange(inp.value.length, inp.value.length);
      inp.onkeydown = function (e) {
        if (e.key === "Enter") saveNote(editing, inp.value.trim());
        if (e.key === "Escape") { editing = null; render(); }
      };
    }
  }

  render();
</script>

</body>
</html>
